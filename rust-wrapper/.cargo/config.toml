# Cargo configuration for cross-platform builds

[target.aarch64-apple-ios]
rustflags = [
    "-C", "link-arg=-mios-version-min=13.0",
    "-C", "link-arg=-L/Applications/Xcode_16.2.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/clang/16/lib/darwin",
    "-C", "link-arg=-lclang_rt.ios",
]

[target.x86_64-apple-ios]
rustflags = [
    "-C", "link-arg=-mios-simulator-version-min=13.0",
    "-C", "link-arg=-L/Applications/Xcode_16.2.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/clang/16/lib/darwin",
    "-C", "link-arg=-lclang_rt.iossim",
]

[target.aarch64-apple-ios-sim]
rustflags = [
    "-C", "link-arg=-mios-simulator-version-min=13.0",
    "-C", "link-arg=-L/Applications/Xcode_16.2.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/clang/16/lib/darwin",
    "-C", "link-arg=-lclang_rt.iossim",
]
